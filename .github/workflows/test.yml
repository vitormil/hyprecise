name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      # The decision core is pure, so the suite runs with no compositor
      # present. If this ever needs a display, something impure leaked in.
      - name: Run spec
        run: lua5.4 tests/hyprecise_spec.lua
